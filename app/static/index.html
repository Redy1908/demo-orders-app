<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orders Console</title>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #111113;
        --surface: #1a1a1e;
        --surface-raised: #212126;
        --line: #34343c;
        --text: #f3f2f5;
        --muted: #aba9b2;
        --accent: #f59e0b;
        --accent-ink: #241707;
        --danger: #ffb4c0;
        --danger-surface: #3b2027;
        --success: #68d9ad;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--canvas);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100% - 32px, 1040px);
        margin: 0 auto;
        padding: 56px 0;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1.1;
      }

      .subtitle {
        margin: 10px 0 32px;
        color: var(--muted);
        font-size: 16px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }

      .status.loading { color: var(--accent); }
      .status.ready { color: var(--success); }
      .status.error { color: var(--danger); }

      button {
        min-height: 38px;
        border: 0;
        border-radius: 6px;
        padding: 0 14px;
        background: var(--accent);
        color: var(--accent-ink);
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 750;
      }

      button:hover { background: #ffb02e; }
      button:focus-visible { outline: 2px solid #ffe0a6; outline-offset: 2px; }
      button:disabled { cursor: wait; opacity: 0.65; }

      .panel {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      th, td {
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }

      th {
        background: var(--surface-raised);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      tr:last-child td { border-bottom: 0; }
      td:last-child { text-align: right; }

      .message {
        display: none;
        padding: 18px;
        color: var(--muted);
      }

      .message.visible { display: block; }

      .message.error {
        border-top: 1px solid #6f3543;
        background: var(--danger-surface);
        color: var(--danger);
      }

      @media (max-width: 600px) {
        main { width: min(100% - 24px, 1040px); padding: 32px 0; }
        h1 { font-size: 28px; }
        th, td { padding: 12px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Demo orders app</p>
      <h1>Orders</h1>
      <p class="subtitle">Current orders from the platform database.</p>

      <div class="toolbar">
        <span id="status" class="status loading" role="status">Loading orders</span>
        <button id="refresh" type="button">Refresh</button>
      </div>

      <section class="panel" aria-label="Orders">
        <table id="orders-table" hidden>
          <thead>
            <tr>
              <th scope="col">Order</th>
              <th scope="col">Customer</th>
              <th scope="col">Item</th>
              <th scope="col">Quantity</th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
        <p id="empty" class="message">No orders found.</p>
        <p id="error" class="message error" role="alert"></p>
      </section>
    </main>

    <script>
      const status = document.getElementById("status");
      const refresh = document.getElementById("refresh");
      const table = document.getElementById("orders-table");
      const body = document.getElementById("orders-body");
      const empty = document.getElementById("empty");
      const error = document.getElementById("error");

      function setStatus(text, state) {
        status.textContent = text;
        status.className = `status ${state}`;
      }

      function clearMessages() {
        error.classList.remove("visible");
        empty.classList.remove("visible");
      }

      function addCell(row, value) {
        const cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);
      }

      async function loadOrders() {
        refresh.disabled = true;
        table.hidden = true;
        body.replaceChildren();
        clearMessages();
        setStatus("Loading orders", "loading");

        try {
          const response = await fetch("/orders");
          if (!response.ok) {
            throw new Error("Unable to load orders from the API.");
          }

          const orders = await response.json();
          if (orders.length === 0) {
            empty.classList.add("visible");
          } else {
            for (const order of orders) {
              const row = document.createElement("tr");
              addCell(row, order.id);
              addCell(row, order.customer);
              addCell(row, order.item);
              addCell(row, order.quantity);
              body.appendChild(row);
            }
            table.hidden = false;
          }

          setStatus(`${orders.length} orders loaded`, "ready");
        } catch (loadError) {
          error.textContent = loadError.message;
          error.classList.add("visible");
          setStatus("Orders unavailable", "error");
        } finally {
          refresh.disabled = false;
        }
      }

      refresh.addEventListener("click", loadOrders);
      loadOrders();
    </script>
  </body>
</html>
